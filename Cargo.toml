[workspace]
resolver = "2"
members = [
    "crates/system-tools-core",
    "crates/packtide",
    "crates/systide",
    "tools/package-manager-matrix",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
version = "0.1.2"
authors = ["wangxianming"]
description = "Cross-distribution package and system maintenance tools"
repository = "https://github.com/muwenyan521/packtide"
homepage = "https://github.com/muwenyan521/packtide"
readme = "README.md"
keywords = ["linux", "package-manager", "tui", "system-update"]
categories = ["command-line-utilities", "os::linux-apis"]
rust-version = "1.88"

[profile.release]
lto = "thin"
codegen-units = 8
strip = "symbols"
panic = "abort"

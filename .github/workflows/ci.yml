name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install integration test sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Select Arch fixture for fake-command integration tests
        run: |
          printf 'ID=arch\nNAME="Arch Linux"\n' > "$RUNNER_TEMP/packtide-os-release"
          echo "PACKTIDE_OS_RELEASE_FILE=$RUNNER_TEMP/packtide-os-release" >> "$GITHUB_ENV"
          echo "PACKTIDE_TEST_ASSUME_ARCH=1" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/fake-arch-bin"
          for command in pacman paru yay flatpak; do
            printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/fake-arch-bin/$command"
            chmod 0755 "$RUNNER_TEMP/fake-arch-bin/$command"
          done
          echo "$RUNNER_TEMP/fake-arch-bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --test-threads=1
      - run: cargo build --workspace --release
      - name: Build musl artifacts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --target x86_64-unknown-linux-musl --workspace --release --locked

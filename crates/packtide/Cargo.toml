[package]
name = "packtide"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-distribution package management TUI and CLI"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
system-tools-core = { path = "../system-tools-core", version = "0.1.0" }
ureq = { version = "3", default-features = false, features = ["rustls"] }
unicode-width = "0.2"
